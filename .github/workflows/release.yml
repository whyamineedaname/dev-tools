name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    name: build (mac)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 单测
        run: npm test

      - name: 编译主进程
        run: npm run build:electron

      - name: 编译渲染进程
        run: npx vite build

      - name: 打包 arm64
        run: npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # sharp 的原生二进制按宿主架构安装，arm64 runner 上只有 arm64 版本。
      # 打 x64 包前换成 x64 的预编译包，否则 Intel Mac 上会因架构不匹配崩溃。
      # 直接取 npm registry 的 tarball 解压，避免 npm install 重算依赖树。
      - name: 切换为 x64 的 sharp 预编译二进制
        run: |
          set -euo pipefail
          SHARP_VER=$(node -p "require('./node_modules/@img/sharp-darwin-arm64/package.json').version")
          LIBVIPS_VER=$(node -p "require('./node_modules/@img/sharp-libvips-darwin-arm64/package.json').version")
          echo "sharp=${SHARP_VER} libvips=${LIBVIPS_VER}"
          mv node_modules/@img "${RUNNER_TEMP}/img-arm64"
          mkdir -p node_modules/@img
          for spec in "sharp-darwin-x64:${SHARP_VER}" "sharp-libvips-darwin-x64:${LIBVIPS_VER}"; do
            pkg="${spec%%:*}"
            ver="${spec##*:}"
            echo "下载 @img/${pkg}@${ver}"
            curl -sSL "https://registry.npmjs.org/@img/${pkg}/-/${pkg}-${ver}.tgz" | tar xz -C node_modules/@img
            mv node_modules/@img/package "node_modules/@img/${pkg}"
          done
          node -p "'已就位: ' + require('./node_modules/@img/sharp-darwin-x64/package.json').version"

      - name: 打包 x64
        run: npx electron-builder --mac --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14

  win:
    name: build (win)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 单测
        run: npm test

      - name: 编译主进程
        run: npm run build:electron

      - name: 编译渲染进程
        run: npx vite build

      - name: 打包
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: win-artifacts
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: upload to release
    needs: [mac, win]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列产物
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
